<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ninja-Belegimport – Anmeldung</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login">
  <form method="post" class="card">
    <h1>Ninja-Belegimport</h1>
    {% if error %}<p class="msg err">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Benutzer <input name="user" autocomplete="username" required autofocus></label>
    <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Anmelden</button>
    <p class="foot">Ninja-Belegimport · <a href="https://cg-sec.de/ninja-belegimport/" target="_blank" rel="noopener">Hilfe &amp; Support</a></p>
  </form>
</body>
</html>
